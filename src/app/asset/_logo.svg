<svg xmlns="http://www.w3.org/2000/svg"  class="logo__glyph" viewBox="0 0 166 120" aria-hidden="true">
<style>
.logo__glyph {
  position: relative;
  width: 78%;
  height: 60%;
  overflow: visible;
}

.glyph {
  fill: none;
  stroke: var(--color-navy);
  stroke-width: 15;
  stroke-linecap: butt;
  stroke-linejoin: miter;
  stroke-miterlimit: 3;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
  animation: glyphDraw 0.6s var(--ease-out-soft) both;
}

.glyph--l {
  animation-delay: 0.55s;
}
.glyph--w {
  animation-delay: 0.66s;
}
.glyph--s {
  animation-delay: 0.77s;
}
</style>
<path class="glyph glyph--l" pathLength="1"
      d="M18 28 L18 90 L52 90" />
<path class="glyph glyph--w" pathLength="1"
      d="M60 28 L72 90 L84 42 L96 90 L108 28" />
<path class="glyph glyph--s" pathLength="1"
      d="M148 28 L120 28 L120 54 L148 54 L148 90 L120 90" />
</svg>